name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the macOS .app/.dmg and attach it
# to the GitHub release. Both the zmax editor (crates/zmax submodule) and the stryke runtime
# (latest strykelang release) are bundled as Tauri externalBin sidecars by the prep scripts that run in
# tauri's beforeBuildCommand, so the shipped .app is self-contained.

on:
  push:
    tags: ["v*"]
  # Re-run a release without cutting a new tag — the only way to retry a build
  # after fixing the workflow itself, since a re-run of a tag build replays the
  # workflow as it was AT that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release (idempotent)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes || true

  macos:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest, not a pinned macos-14: the rest of the org's release
          # workflows track macos-latest, and the pinned image's toolchain is the
          # most likely reason one tree-sitter grammar (autohotkey) fails to compile
          # here while the identical source builds locally. Not confirmed — the
          # grammar builder swallows the compiler diagnostic — but the pin has no
          # reason to exist either way.
          - runner: macos-latest   # Apple silicon → aarch64
            arch: aarch64
          # x86_64 REMOVED from the matrix: the macos-13 Intel runners exist but
          # their free-tier queue never scheduled this job — every release from
          # v0.2.2 (2026-07-11) to v0.2.18 (2026-08-01) sat queued until the
          # 24-hour timeout and reported the whole run as failed. Same call, and
          # the same reason, as awkrs' release matrix. Restore the leg when GHA
          # reinstates Intel macOS capacity.
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # PAT with read access to the private submodule repos (zmax-gui-core,
          # zpwr-embed-terminal, …); the default GITHUB_TOKEN can't clone them.
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Rust toolchain
        run: rustup update --no-self-update stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/zmax/target
            app/src-tauri/target
          key: ${{ matrix.arch }}-cargo-${{ hashFiles('crates/zmax/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.arch }}-cargo-

      # pnpm 11, matching the version that writes the lockfile. `overrides`
      # lives in pnpm-workspace.yaml, which only pnpm 10+ reads (pnpm 11 no
      # longer reads the `pnpm` field from package.json at all), so pnpm 9 saw
      # no overrides configured, found one recorded in the lockfile, and
      # refused the frozen install with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Node 22 is the floor pnpm 11.24 states ("requires at least Node.js
      # v22.13"); it reaches for `node:sqlite`, which Node 20 does not have,
      # so the pnpm shim died with ERR_UNKNOWN_BUILTIN_MODULE before running.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Build the editor in release so the staged sidecar is a release binary (the prep script prefers
      # target/release and won't rebuild). Native target = the runner arch, matching the app bundle.
      - name: Build zmax editor (release)
        working-directory: crates/zmax
        run: cargo build --release --locked --bin zmax

      - name: Install JS deps
        # package.json pulls zgui-core straight from git
        # ("github:MenkeTechnologies/zgui-core#<sha>") and that repo is private,
        # so pnpm's own `git fetch` needs credentials the checkout step's token
        # never reaches. Without this it dies with
        #   fatal: could not read Username for 'https://github.com'
        # GIT_CONFIG_* is process-scoped, so it reaches every git pnpm spawns
        # without writing runner-persistent global config.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: pnpm install --frozen-lockfile

      # tauri build runs beforeBuildCommand: copy-embed-terminal + prepare-stryke-sidecar (downloads
      # the strykelang release for this arch) + prepare-zmax-sidecar (stages the release editor).
      # --bundles app,dmg: tauri.conf.json pins bundle.targets to ["app"] so a local
      # `pnpm localinstall` skips the slow DMG step. Releases still ship a .dmg, so CI
      # has to ask for it explicitly — without this the packaging step below finds no
      # .dmg and fails with "bundle not found".
      - name: Build the app bundle
        # `app/src-tauri` takes `account-client` from the private zpwr-account
        # repo, so the cargo build inside `tauri build` needs the same
        # credentials `pnpm install` above was given — without them it dies with
        #   failed to authenticate when downloading repository
        #   * attempted to find username/password via git's `credential.helper`
        # cargo's bundled git (libgit2) does not read GIT_CONFIG_*, so it is
        # pointed at the git CLI, which does. That is cargo's own advice in the
        # same error: "if the git CLI succeeds then `net.git-fetch-with-cli` may
        # help here".
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: pnpm tauri build --bundles app,dmg

      - name: Package + upload .dmg and .app
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          # Find the produced bundle under the tauri target dir (resilient to the app/src-tauri layout
          # and any target-triple subdir).
          DMG="$(find app/src-tauri/target -path '*/release/bundle/dmg/*.dmg' | head -1)"
          APP="$(find app/src-tauri/target -path '*/release/bundle/macos/*.app' -type d | head -1)"
          if [ -z "$DMG" ] || [ -z "$APP" ]; then
            echo "::error::bundle not found"; find app/src-tauri/target -path '*/bundle/*' -maxdepth 8 | head -50; exit 1
          fi
          OUT="$RUNNER_TEMP/zmax-gui-${TAG}-${{ matrix.arch }}"
          cp "$DMG" "${OUT}.dmg"
          ditto -c -k --keepParent "$APP" "${OUT}.app.zip"
          gh release upload "$TAG" "${OUT}.dmg" "${OUT}.app.zip" --clobber
